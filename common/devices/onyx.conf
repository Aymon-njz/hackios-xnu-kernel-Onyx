# Xiaomi POCO F7 / Redmi Turbo 4 Pro (onyx, Snapdragon 8s Gen 4 / Pakala).
# Values are from the upstream Mu-Silicium onyxPkg and the captured live DTB.
NAME="Xiaomi POCO F7 / Redmi Turbo 4 Pro (onyx)"
KIND=phone
SOC="Qualcomm SM8735 (Pakala)"

# Mu-Silicium's upstream onyx package is required; no UEFI binary is bundled here.
UEFI_TARGET=onyx
# Callers may point these at a freshly verified CI artifact or captured DTB.
UEFI_FD="${UEFI_FD:-}"
DTB="${DTB:-}"
FD_BASE=0xA7100000
FD_SIZE=0x300000
PAYLOAD_BASE=0xA8000000
BOOT_HEADER_VERSION=4

# Splash framebuffer and GICv3 are verified from the phone's live Android DTB.
FB_BASE=0xFC800000
WIFI_ATH11K=0

# Start with the generic display/CPU path only.  Onyx input and peripheral
# drivers will be enabled individually after their DT bindings are ported.
BOOTARGS="cpus=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""

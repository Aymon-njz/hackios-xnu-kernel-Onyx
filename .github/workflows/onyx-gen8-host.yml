name: Check Onyx Gen8 GPU components
on:
  workflow_dispatch:
  push:
    paths:
      - 'devices/onyx/drivers/gpu/**'
      - 'xnu/files/bsd/dev/hakios.onyx_gen8*.h'
      - '.github/workflows/onyx-gen8-host.yml'
jobs:
  firmware-parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate GMU clock setup and rollback paths
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gen8_power.c \
            tools/onyx-gmu-clock-test.c -o /tmp/onyx-gmu-clock-test
          /tmp/onyx-gmu-clock-test
      - name: Validate GMU attachment and startup transports
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gmu_mmu.c \
            devices/onyx/drivers/gpu/hakios.onyx_gmu_attach.c \
            devices/onyx/drivers/gpu/hakios.onyx_gmu_start.c \
            tools/onyx-gmu-lifecycle-test.c -o /tmp/onyx-gmu-lifecycle-test
          /tmp/onyx-gmu-lifecycle-test
      - name: Validate GMU firmware backing and failure cleanup
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gmu_memory.c \
            devices/onyx/drivers/gpu/hakios.onyx_gmu_mmu.c \
            devices/onyx/drivers/gpu/hakios.onyx_gen8_firmware.c \
            devices/onyx/drivers/gpu/hakios.onyx_gen8_hfi.c \
            tools/onyx-gmu-memory-test.c -o /tmp/onyx-gmu-memory-test
          /tmp/onyx-gmu-memory-test
      - name: Validate unattached GMU page tables
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gmu_mmu.c \
            tools/onyx-gmu-mmu-test.c -o /tmp/onyx-gmu-mmu-test
          /tmp/onyx-gmu-mmu-test
      - name: Validate read-only GMUCX counter access
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gen8_power.c \
            tools/onyx-gmu-counter-test.c -o /tmp/onyx-gmu-counter-test
          /tmp/onyx-gmu-counter-test
      - name: Validate CX power-on failure and rollback paths
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_gen8_power.c \
            tools/onyx-cx-enable-test.c -o /tmp/onyx-cx-enable-test
          /tmp/onyx-cx-enable-test
      - name: Validate RSC request and failure paths
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_rpmh.c \
            tools/onyx-rsc-transport-test.c -o /tmp/onyx-rsc-transport-test
          /tmp/onyx-rsc-transport-test
      - name: Validate RPMh resource table parser
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev devices/onyx/drivers/gpu/hakios.onyx_rpmh.c \
            tools/onyx-rpmh-test.c -o /tmp/onyx-rpmh-test
          /tmp/onyx-rpmh-test
      - name: Validate measured GPU power status decoding
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ixnu/files/bsd/dev tools/onyx-gen8-power-test.c -o /tmp/onyx-gen8-power-test
          /tmp/onyx-gen8-power-test
      - name: Validate malformed firmware handling with sanitizers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ixnu/files/bsd/dev \
            devices/onyx/drivers/gpu/hakios.onyx_gen8_firmware.c \
            devices/onyx/drivers/gpu/firmware_test.c -o /tmp/onyx-gen8-firmware-test
          /tmp/onyx-gen8-firmware-test
      - name: Validate HFI queues with sanitizers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Ixnu/files/bsd/dev \
            devices/onyx/drivers/gpu/hakios.onyx_gen8_hfi.c \
            devices/onyx/drivers/gpu/hfi_test.c -o /tmp/onyx-gen8-hfi-test
          /tmp/onyx-gen8-hfi-test
